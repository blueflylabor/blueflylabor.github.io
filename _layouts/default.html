<!DOCTYPE html>
<html lang="{{ site.language }}">

<head>
  {% include head.html %}
  
  <!-- 原始 巫师 Loading 动画专属样式（全独立且纯靠内联样式渲染） -->
  <style>
    #loader.wz-loader-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999999;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      overflow: hidden;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      box-sizing: border-box;
    }

    #loader.wz-loader-screen.is-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    #loader.wz-loader-screen *,
    #loader.wz-loader-screen *::before,
    #loader.wz-loader-screen *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Scene */
    #loader .scene {
      display: flex;
      position: relative;
    }

    /* Objects */
    #loader .objects {
      position: relative;
      width: 200px;
      height: 240px;
    }

    #loader .square {
      position: absolute;
      bottom: -60px;
      left: -5px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      transform: rotate(-360deg);
      animation: wz_path_square 10s ease-in-out infinite;
    }
    #loader .square::after {
      content: "";
      position: absolute;
      top: 10px;
      left: 0;
      width: 50px;
      height: 50px;
      background: #9ab3f5;
    }

    #loader .circle {
      position: absolute;
      bottom: 10px;
      left: 0;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      transform: rotate(-360deg);
      animation: wz_path_circle 10s ease-in-out infinite;
    }
    #loader .circle::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 25px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #c56183;
    }

    #loader .triangle {
      position: absolute;
      bottom: -62px;
      left: -10px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      transform: rotate(-360deg);
      animation: wz_path_triangle 10s ease-in-out infinite;
    }
    #loader .triangle::after {
      content: "";
      position: absolute;
      top: 0;
      right: -10px;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 28px 48px 28px;
      border-color: transparent transparent #89beb3 transparent;
    }

    /* Wizard Core */
    #loader .wizard {
      position: relative;
      width: 190px;
      height: 240px;
    }

    #loader .body {
      position: absolute;
      bottom: 0;
      left: 68px;
      height: 100px;
      width: 60px;
      background: #3f64ce;
    }
    #loader .body::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 20px;
      height: 100px;
      width: 60px;
      background: #3f64ce;
      transform: skewX(14deg);
    }

    #loader .right-arm {
      position: absolute;
      bottom: 74px;
      left: 110px;
      height: 44px;
      width: 90px;
      background: #3f64ce;
      border-radius: 22px;
      transform-origin: 16px 22px;
      transform: rotate(70deg);
      animation: wz_right_arm 10s ease-in-out infinite;
    }
    #loader .right-arm .right-hand {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #f1c5b4;
      transform-origin: center center;
      transform: rotate(-40deg);
      animation: wz_right_hand 10s ease-in-out infinite;
    }
    #loader .right-arm .right-hand::after {
      content: "";
      position: absolute;
      right: 0px;
      top: -8px;
      width: 15px;
      height: 30px;
      border-radius: 10px;
      background: #f1c5b4;
      transform: translateY(16px);
      animation: wz_right_finger 10s ease-in-out infinite;
    }

    #loader .left-arm {
      position: absolute;
      bottom: 74px;
      left: 26px;
      height: 44px;
      width: 70px;
      background: #3f64ce;
      border-bottom-left-radius: 8px;
      transform-origin: 60px 26px;
      transform: rotate(-70deg);
      animation: wz_left_arm 10s ease-in-out infinite;
    }
    #loader .left-arm .left-hand {
      position: absolute;
      left: -18px;
      top: 0;
      width: 18px;
      height: 30px;
      border-top-left-radius: 35px;
      border-bottom-left-radius: 35px;
      background: #f1c5b4;
    }
    #loader .left-arm .left-hand::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      width: 30px;
      height: 15px;
      border-radius: 20px;
      background: #f1c5b4;
      transform-origin: right bottom;
      transform: scaleX(0);
      animation: wz_left_finger 10s ease-in-out infinite;
    }

    #loader .head {
      position: absolute;
      top: 0;
      left: 14px;
      width: 160px;
      height: 210px;
      transform-origin: center center;
      transform: rotate(-3deg);
      animation: wz_head 10s ease-in-out infinite;
    }
    #loader .head .beard {
      position: absolute;
      bottom: 0;
      left: 38px;
      height: 106px;
      width: 80px;
      border-bottom-right-radius: 55%;
      background: #ffffff;
    }
    #loader .head .beard::after {
      content: "";
      position: absolute;
      top: 16px;
      left: -10px;
      width: 40px;
      height: 20px;
      border-radius: 20px;
      background: #ffffff;
    }
    #loader .head .face {
      position: absolute;
      bottom: 76px;
      left: 38px;
      height: 30px;
      width: 60px;
      background: #f1c5b4;
    }
    #loader .head .face::before {
      content: "";
      position: absolute;
      top: 0px;
      left: 40px;
      width: 20px;
      height: 40px;
      border-bottom-right-radius: 20px;
      border-bottom-left-radius: 20px;
      background: #f1c5b4;
    }
    #loader .head .face::after {
      content: "";
      position: absolute;
      top: 16px;
      left: -10px;
      width: 50px;
      height: 20px;
      border-radius: 20px;
      border-bottom-right-radius: 0px;
      background: #ffffff;
    }
    #loader .head .face .adds {
      position: absolute;
      top: 0px;
      left: -10px;
      width: 40px;
      height: 20px;
      border-radius: 20px;
      background: #f1c5b4;
    }
    #loader .head .face .adds::after {
      content: "";
      position: absolute;
      top: 5px;
      left: 80px;
      width: 15px;
      height: 20px;
      border-bottom-right-radius: 20px;
      border-top-right-radius: 20px;
      background: #f1c5b4;
    }

    #loader .head .hat {
      position: absolute;
      bottom: 106px;
      left: 0;
      width: 160px;
      height: 20px;
      border-radius: 20px;
      background: #3f64ce;
    }
    #loader .head .hat::before {
      content: "";
      position: absolute;
      top: -70px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 34px 70px 50px;
      border-color: transparent transparent #3f64ce transparent;
    }
    #loader .head .hat::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 160px;
      height: 20px;
      background: #3f64ce;
      border-radius: 20px;
    }
    #loader .head .hat .hat-of-the-hat {
      position: absolute;
      bottom: 78px;
      left: 79px;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 25px 25px 19px;
      border-color: transparent transparent #3f64ce transparent;
    }
    #loader .head .hat .hat-of-the-hat::after {
      content: "";
      position: absolute;
      top: 6px;
      left: -4px;
      width: 35px;
      height: 10px;
      border-radius: 10px;
      border-bottom-left-radius: 0px;
      background: #3f64ce;
      transform: rotate(40deg);
    }

    #loader .head .hat .four-point-star {
      position: absolute;
      width: 12px;
      height: 12px;
    }
    #loader .head .hat .four-point-star::after,
    #loader .head .hat .four-point-star::before {
      content: "";
      position: absolute;
      background: #ffffff;
      display: block;
      left: 0;
      width: 141.4213%;
      top: 0;
      bottom: 0;
      border-radius: 10%;
      transform: rotate(66.66deg) skewX(45deg);
    }
    #loader .head .hat .four-point-star::after {
      transform: rotate(156.66deg) skew(45deg);
    }
    #loader .head .hat .four-point-star.--first {
      bottom: 28px;
      left: 46px;
    }
    #loader .head .hat .four-point-star.--second {
      bottom: 40px;
      left: 80px;
    }
    #loader .head .hat .four-point-star.--third {
      bottom: 15px;
      left: 108px;
    }

    /* Progress Bar (改为内联JS控制动态宽度) */
    #loader .progress {
      position: relative;
      margin-top: 60px;
      width: 400px;
      height: 20px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
    }

    /* Keyframe Animations */
    @keyframes wz_right_arm {
      0% { transform: rotate(70deg); }
      10% { transform: rotate(8deg); }
      15% { transform: rotate(20deg); }
      20% { transform: rotate(10deg); }
      25% { transform: rotate(26deg); }
      30% { transform: rotate(10deg); }
      35% { transform: rotate(28deg); }
      40% { transform: rotate(9deg); }
      45% { transform: rotate(28deg); }
      50% { transform: rotate(8deg); }
      58% { transform: rotate(74deg); }
      62% { transform: rotate(70deg); }
    }

    @keyframes wz_left_arm {
      0% { transform: rotate(-70deg); }
      10% { transform: rotate(6deg); }
      15% { transform: rotate(-18deg); }
      20% { transform: rotate(5deg); }
      25% { transform: rotate(-18deg); }
      30% { transform: rotate(5deg); }
      35% { transform: rotate(-17deg); }
      40% { transform: rotate(5deg); }
      45% { transform: rotate(-18deg); }
      50% { transform: rotate(6deg); }
      58% { transform: rotate(-74deg); }
      62% { transform: rotate(-70deg); }
    }

    @keyframes wz_right_hand {
      0% { transform: rotate(-40deg); }
      10% { transform: rotate(-20deg); }
      15% { transform: rotate(-5deg); }
      20% { transform: rotate(-60deg); }
      25% { transform: rotate(-0deg); }
      30% { transform: rotate(-60deg); }
      35% { transform: rotate(-0deg); }
      40% { transform: rotate(-40deg); }
      45% { transform: rotate(-60deg); }
      50% { transform: rotate(10deg); }
      60% { transform: rotate(-40deg); }
    }

    @keyframes wz_right_finger {
      0% { transform: translateY(16px); }
      10% { transform: none; }
      50% { transform: none; }
      60% { transform: translateY(16px); }
    }

    @keyframes wz_left_finger {
      0% { transform: scaleX(0); }
      10% { transform: scaleX(1) rotate(6deg); }
      15% { transform: scaleX(1) rotate(0deg); }
      20% { transform: scaleX(1) rotate(8deg); }
      25% { transform: scaleX(1) rotate(0deg); }
      30% { transform: scaleX(1) rotate(7deg); }
      35% { transform: scaleX(1) rotate(0deg); }
      40% { transform: scaleX(1) rotate(5deg); }
      45% { transform: scaleX(1) rotate(0deg); }
      50% { transform: scaleX(1) rotate(6deg); }
      58% { transform: scaleX(0); }
    }

    @keyframes wz_head {
      0% { transform: rotate(-3deg); }
      10% { transform: translateX(10px) rotate(7deg); }
      50% { transform: translateX(0px) rotate(0deg); }
      56% { transform: rotate(-3deg); }
    }

    @keyframes wz_path_circle {
      0% { transform: translateY(0); }
      10% { transform: translateY(-100px) rotate(-5deg); }
      55% { transform: translateY(-100px) rotate(-360deg); }
      58% { transform: translateY(-100px) rotate(-360deg); }
      63% { transform: rotate(-360deg); }
    }

    @keyframes wz_path_square {
      0% { transform: translateY(0); }
      10% { transform: translateY(-155px) translateX(-15px) rotate(10deg); }
      55% { transform: translateY(-155px) translateX(-15px) rotate(-350deg); }
      57% { transform: translateY(-155px) translateX(-15px) rotate(-350deg); }
      63% { transform: rotate(-360deg); }
    }

    @keyframes wz_path_triangle {
      0% { transform: translateY(0); }
      10% { transform: translateY(-172px) translateX(10px) rotate(-10deg); }

      63% { transform: rotate(-360deg); }
    }

<body>
  <!-- 1. 巫师加载屏 DOM -->
  <div id="loader" class="wz-loader-screen">
    <div class="scene">
      <div class="objects">
        <div class="square"></div>
        <div class="circle"></div>
        <div class="triangle"></div>
      </div>
      <div class="wizard">
        <div class="body"></div>
        <div class="right-arm">
          <div class="right-hand"></div>
        </div>
        <div class="left-arm">
          <div class="left-hand"></div>
        </div>
        <div class="head">
          <div class="beard"></div>
          <div class="face">
            <div class="adds"></div>
          </div>
          <div class="hat">
            <div class="hat-of-the-hat"></div>
            <div class="four-point-star --first"></div>
            <div class="four-point-star --second"></div>
            <div class="four-point-star --third"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="progress"></div>
    <div class="noise"></div>
  </div>

  <!-- 2. 主站页面容器 -->
  <div class="container-wrapper">
    <header class="container-header">
      {% include header.html %}
    </header>
    <main class="container-main">
      {{content}}
    </main>
    <footer class="container-footer">
      {% include footer.html %}
    </footer>
  </div>

<!-- 优化后的平滑加载与过渡脚本 -->
<script>
  (function () {
    'use strict';
    var progressBar = document.querySelector('#loader .progress');
    
    // 创建内部填充条
    var progressFill = document.createElement('div');
    // 使用 linear 和适中时间，保证从 0 到 100% 的过场肉眼可见且顺滑
    progressFill.style.cssText = 'height: 100%; width: 0%; background: #637373; transition: width 0.4s linear; border-radius: 10px;';
    if (progressBar) {
      progressBar.appendChild(progressFill);
    }

    function setProgressBar(val) {
      if (progressFill) {
        progressFill.style.width = Math.min(val, 100) + '%';
      }
    }

    // 1. 强制在下一帧绘制起点 0% -> 25% 的初始动画
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        setProgressBar(25);
      });
    });

    var currentProgress = 25;

    // 2. 模拟阶段性增长（最高到 85%）
    var progressInterval = setInterval(function () {
      if (currentProgress < 85) {
        currentProgress += Math.random() * 15 + 10;
        setProgressBar(currentProgress);
      }
    }, 150);

    var isDismissed = false;

    function dismissLoader() {
      if (isDismissed) return;
      isDismissed = true;

      clearInterval(progressInterval);
      
      // 3. 强制把动画时间改为 0.3s 来滑向 100%，确保有滑满的视觉反馈
      if (progressFill) {
        progressFill.style.transition = 'width 0.3s ease-out';
      }
      setProgressBar(100);

      // 4. 给进度条 350ms 走完填充动画，然后再让整个屏幕淡出
      setTimeout(function () {
        var loader = document.getElementById('loader');
        if (loader) {
          loader.classList.add('is-hidden');
          setTimeout(function () {
            loader.style.display = 'none';
          }, 500); // 对应 CSS 0.5s 透明度淡出
        }
      }, 350); 
    }

    // 5. 即使网页秒开，也强制保留至少 400ms 的最小播放展现，防止“直接全满”
    if (document.readyState === 'complete') {
      setTimeout(dismissLoader, 400);
    } else {
      window.addEventListener('load', function () {
        setTimeout(dismissLoader, 300);
      });
    }

    // 保底机制：最多 5 秒强行关闭
    setTimeout(dismissLoader, 5000);
  })();
</script>
