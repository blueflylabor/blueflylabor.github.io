<!DOCTYPE html>
<html lang="{{ site.language }}">

<head>
  {% include head.html %}
  
  <!-- 防闪烁及状态读取 -->
  <script>
    if (localStorage.getItem('site_theme') === 'dark') {
      document.documentElement.classList.add('dark-mode');
    }
  </script>
</head>

<body>
  {% include wizard.html %}

  <div class="container-wrapper">
    <header class="container-header">
      {% include header.html %}
    </header>
    <main class="container-main">
      {{content}}
    </main>
    <footer class="container-footer">
      {% include footer.html %}
    </footer>
  </div>

  <!-- 必须在这里：紧贴 body 结束标签之前，前面没有任何包裹容器 -->
  <button id="theme-btn" class="theme-toggle-btn" type="button" aria-label="Toggle Theme">
    <span id="theme-btn-text">🌙 Dark Mode</span>
  </button>

  <button id="back-to-top-btn" class="back-to-top-btn" type="button" aria-label="Back to Top">
    <span>⬆ TOP</span>
  </button>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const btn = document.getElementById('theme-btn');
      const btnText = document.getElementById('theme-btn-text');
      const htmlEl = document.documentElement;

      function updateUI(isDark) {
        if (isDark) {
          htmlEl.classList.add('dark-mode');
          btnText.textContent = '☀️ Light Mode';
        } else {
          htmlEl.classList.remove('dark-mode');
          btnText.textContent = '🌙 Dark Mode';
        }
      }

      const isDark = localStorage.getItem('site_theme') === 'dark';
      updateUI(isDark);

      btn.addEventListener('click', function () {
        const currentlyDark = htmlEl.classList.contains('dark-mode');
        const nextState = !currentlyDark;
        
        localStorage.setItem('site_theme', nextState ? 'dark' : 'light');
        updateUI(nextState);
      });
    });
  </script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
      const topBtn = document.getElementById('back-to-top-btn');

      // 1. 监听滚动条显示/隐藏回到顶部按钮
      window.addEventListener('scroll', function () {
        if (window.scrollY > 300) { // 当页面向下滚动超过 300px 时显示
          topBtn.classList.add('is-visible');
        } else {
          topBtn.classList.remove('is-visible');
        }
      });

      // 2. 点击平滑滚动回顶部
      topBtn.addEventListener('click', function () {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      });
    });
  </script>
<!-- 访客 IP 显示容器 -->
<div id="visitor-ip-box" style="position: fixed; bottom: 70px; left: 25px; z-index: 999; font-size: 12px; opacity: 0.7; font-family: monospace;">
  📍 IP: <span id="ip-display">获取中...</span>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    // 调用免费的 IP 查寻接口
    fetch('https://api.ipify.org?format=json')
      .then(response => response.json())
      .then(data => {
        const ipSpan = document.getElementById('ip-display');
        if (ipSpan) {
          ipSpan.textContent = data.ip;
        }
      })
      .catch(error => {
        const ipSpan = document.getElementById('ip-display');
        if (ipSpan) {
          ipSpan.textContent = '获取失败';
        }
      });
  });
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (!sessionStorage.getItem('ip_logged')) {
      
      // 核心获取 IP 函数
      function fetchVisitorIP() {
        // 方案 A：优先尝试国际通用接口（适合海外用户，全球 CDN 加速）
        fetch('https://api.ipify.org?format=json')
          .then(res => res.json())
          .then(data => {
            sendVisitorData(data.ip, 'Global-IPify');
          })
          .catch(() => {
            console.log('国际接口超时，切换国内备用接口...');
            // 方案 B：如果国际接口失败（说明在国内且被墙），自动切换搜狐国内接口
            fetchSohuIP();
          });
      }

      function fetchSohuIP() {
        fetch('https://www.cloudflare.com/cdn-cgi/trace')
          .then(res => res.text())
          .then(text => {
            let match = text.match(/\{.*?\}/);
            if (match) {
              let data = JSON.parse(match[0]);
              sendVisitorData(data.cip, data.cname || '国内用户');
            }
          })
          .catch(err => console.log('所有 IP 接口获取均失败', err));
      }

      // 统一发送数据到云端（Web3Forms）
      function sendVisitorData(ip, locationInfo) {
        const formData = {
          access_key: '4b66843b-f05b-4f98-a7a2-afff28ade021', 
          subject: '📢 博客新访客记录',
          'IP 地址': ip,
          '归属/来源': locationInfo,
          '访问时间': new Date().toLocaleString(),
          '访问页面': document.title
        };

        fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(formData)
        }).catch(err => console.log('云端保存失败', err));

        sessionStorage.setItem('ip_logged', 'true');
      }

      // 执行获取
      fetchVisitorIP();
    }
  });
</script>

  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "940dfefdbc6d434d9a79d25fae9b173e"}'></script>
</body>
</html>
