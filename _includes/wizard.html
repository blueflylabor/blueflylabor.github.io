<!-- 
  巫师 Loading 动画专属样式（支持主题跟随与暗黑模式版）
-->
<style>
  /* 1. 定义主题颜色变量 */
  :root {
    --wz-loader-bg: #358561;               /* 默认浅色/绿豆沙背景 */
    --wz-progress-bg: rgba(255, 255, 255, 0.2);
    --wz-progress-fill: #2d503f;           /* 进度条填充色 */
    --wz-mac-logo-color: #E2E8F0;          /* macOS Logo 颜色 */
  }

  /* 2. 暗黑模式下的变量重写 */
  html.dark-mode {
    --wz-loader-bg: #c6a2f5;               /* 深色模式背景（深灰黑） */
    --wz-progress-bg: rgba(255, 255, 255, 0.08);
    --wz-progress-fill: #3f64ce;           /* 深色模式下用巫师衣服的同系蓝色作为进度条 */
    --wz-mac-logo-color: #94A3B8;
  }

  #loader.wz-loader-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 999999;
    /* 关键：动态使用变量，支持无缝切换 */
    background-color: var(--wz-loader-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    overflow: hidden;
    opacity: 1;
    visibility: visible;
    transition: opacity 0.5s ease, visibility 0.5s ease, background-color 0.3s ease;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  #loader.wz-loader-screen.is-hidden {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }

  #loader.wz-loader-screen *,
  #loader.wz-loader-screen *::before,
  #loader.wz-loader-screen *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* Scene */
  #loader .scene {
    display: flex;
    position: relative;
  }

  /* Objects 区域：用于挂载三个 Logo */
  #loader .objects {
    position: relative;
    width: 200px;
    height: 240px;
  }

  /* 基础 Logo 容器属性 */
  #loader .objects .logo-item {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3));
  }

  #loader .objects .logo-item svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* 1. Linux Logo (Tux) */
  #loader .logo-linux {
    bottom: -50px;
    left: -25px;
    width: 62px;
    height: 62px;
    animation: wz_path_linux 10s ease-in-out infinite;
  }

  /* 2. Python Logo */
  #loader .logo-python {
    bottom: 20px;
    left: 10px;
    width: 58px;
    height: 58px;
    animation: wz_path_python 10s ease-in-out infinite;
  }

  /* 3. macOS Logo (Apple) */
  #loader .logo-mac {
    bottom: -50px;
    left: 45px;
    width: 52px;
    height: 52px;
    color: var(--wz-mac-logo-color); 
    animation: wz_path_mac 10s ease-in-out infinite;
    transition: color 0.3s ease;
  }

  /* Wizard Core */
  #loader .wizard {
    position: relative;
    width: 190px;
    height: 240px;
  }

  #loader .body {
    position: absolute;
    bottom: 0;
    left: 68px;
    height: 100px;
    width: 60px;
    background: #3f64ce;
  }
  #loader .body::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 20px;
    height: 100px;
    width: 60px;
    background: #3f64ce;
    transform: skewX(14deg);
  }

  #loader .right-arm {
    position: absolute;
    bottom: 74px;
    left: 110px;
    height: 44px;
    width: 90px;
    background: #3f64ce;
    border-radius: 22px;
    transform-origin: 16px 22px;
    transform: rotate(70deg);
    animation: wz_right_arm 10s ease-in-out infinite;
  }
  #loader .right-arm .right-hand {
    position: absolute;
    right: 8px;
    bottom: 8px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #f1c5b4;
    transform-origin: center center;
    transform: rotate(-40deg);
    animation: wz_right_hand 10s ease-in-out infinite;
  }
  #loader .right-arm .right-hand::after {
    content: "";
    position: absolute;
    right: 0px;
    top: -8px;
    width: 15px;
    height: 30px;
    border-radius: 10px;
    background: #f1c5b4;
    transform: translateY(16px);
    animation: wz_right_finger 10s ease-in-out infinite;
  }

  #loader .left-arm {
    position: absolute;
    bottom: 74px;
    left: 26px;
    height: 44px;
    width: 70px;
    background: #3f64ce;
    border-bottom-left-radius: 8px;
    transform-origin: 60px 26px;
    transform: rotate(-70deg);
    animation: wz_left_arm 10s ease-in-out infinite;
  }
  #loader .left-arm .left-hand {
    position: absolute;
    left: -18px;
    top: 0;
    width: 18px;
    height: 30px;
    border-top-left-radius: 35px;
    border-bottom-left-radius: 35px;
    background: #f1c5b4;
  }
  #loader .left-arm .left-hand::after {
    content: "";
    position: absolute;
    right: 0;
    top: 0;
    width: 30px;
    height: 15px;
    border-radius: 20px;
    background: #f1c5b4;
    transform-origin: right bottom;
    transform: scaleX(0);
    animation: wz_left_finger 10s ease-in-out infinite;
  }

  #loader .head {
    position: absolute;
    top: 0;
    left: 14px;
    width: 160px;
    height: 210px;
    transform-origin: center center;
    transform: rotate(-3deg);
    animation: wz_head 10s ease-in-out infinite;
  }
  #loader .head .beard {
    position: absolute;
    bottom: 0;
    left: 38px;
    height: 106px;
    width: 80px;
    border-bottom-right-radius: 55%;
    background: #ffffff;
  }
  #loader .head .beard::after {
    content: "";
    position: absolute;
    top: 16px;
    left: -10px;
    width: 40px;
    height: 20px;
    border-radius: 20px;
    background: #ffffff;
  }
  #loader .head .face {
    position: absolute;
    bottom: 76px;
    left: 38px;
    height: 30px;
    width: 60px;
    background: #f1c5b4;
  }
  #loader .head .face::before {
    content: "";
    position: absolute;
    top: 0px;
    left: 40px;
    width: 20px;
    height: 40px;
    border-bottom-right-radius: 20px;
    border-bottom-left-radius: 20px;
    background: #f1c5b4;
  }
  #loader .head .face::after {
    content: "";
    position: absolute;
    top: 16px;
    left: -10px;
    width: 50px;
    height: 20px;
    border-radius: 20px;
    border-bottom-right-radius: 0px;
    background: #ffffff;
  }
  #loader .head .face .adds {
    position: absolute;
    top: 0px;
    left: -10px;
    width: 40px;
    height: 20px;
    border-radius: 20px;
    background: #f1c5b4;
  }
  #loader .head .face .adds::after {
    content: "";
    position: absolute;
    top: 5px;
    left: 80px;
    width: 15px;
    height: 20px;
    border-bottom-right-radius: 20px;
    border-top-right-radius: 20px;
    background: #f1c5b4;
  }

  #loader .head .hat {
    position: absolute;
    bottom: 106px;
    left: 0;
    width: 160px;
    height: 20px;
    border-radius: 20px;
    background: #3f64ce;
  }
  #loader .head .hat::before {
    content: "";
    position: absolute;
    top: -70px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 34px 70px 50px;
    border-color: transparent transparent #3f64ce transparent;
  }
  #loader .head .hat::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 160px;
    height: 20px;
    background: #3f64ce;
    border-radius: 20px;
  }
  #loader .head .hat .hat-of-the-hat {
    position: absolute;
    bottom: 78px;
    left: 79px;
    width: 0;
    height: 0;
    border-style: solid;
    border-width: 0 25px 25px 19px;
    border-color: transparent transparent #3f64ce transparent;
  }
  #loader .head .hat .hat-of-the-hat::after {
    content: "";
    position: absolute;
    top: 6px;
    left: -4px;
    width: 35px;
    height: 10px;
    border-radius: 10px;
    border-bottom-left-radius: 0px;
    background: #3f64ce;
    transform: rotate(40deg);
  }

  #loader .head .hat .four-point-star {
    position: absolute;
    width: 12px;
    height: 12px;
  }
  #loader .head .hat .four-point-star::after,
  #loader .head .hat .four-point-star::before {
    content: "";
    position: absolute;
    background: #ffffff;
    display: block;
    left: 0;
    width: 141.4213%;
    top: 0;
    bottom: 0;
    border-radius: 10%;
    transform: rotate(66.66deg) skewX(45deg);
  }
  #loader .head .hat .four-point-star::after {
    transform: rotate(156.66deg) skew(45deg);
  }
  #loader .head .hat .four-point-star.--first {
    bottom: 28px;
    left: 46px;
  }
  #loader .head .hat .four-point-star.--second {
    bottom: 40px;
    left: 80px;
  }
  #loader .head .hat .four-point-star.--third {
    bottom: 15px;
    left: 108px;
  }

  /* Progress Bar */
  #loader .progress {
    position: relative;
    margin-top: 60px;
    width: 400px;
    height: 20px;
    background: var(--wz-progress-bg);
    border-radius: 10px;
    overflow: hidden;
    transition: background 0.3s ease;
  }

  #loader .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--wz-progress-fill);
    transition: width 0.4s linear, background 0.3s ease;
    border-radius: 10px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
  }

  /* Noise Overlay */
  #loader .noise {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    z-index: 1000;

  /* 巫师动作 Animation */
  @keyframes wz_right_arm {
    0% { transform: rotate(70deg); }
    10% { transform: rotate(8deg); }
    15% { transform: rotate(20deg); }
    20% { transform: rotate(10deg); }
    25% { transform: rotate(26deg); }
    30% { transform: rotate(10deg); }
    35% { transform: rotate(28deg); }
    40% { transform: rotate(9deg); }
    45% { transform: rotate(28deg); }
    50% { transform: rotate(8deg); }
    58% { transform: rotate(74deg); }
    62% { transform: rotate(70deg); }
  }

  @keyframes wz_left_arm {
    0% { transform: rotate(-70deg); }
    10% { transform: rotate(6deg); }
    15% { transform: rotate(-18deg); }
    20% { transform: rotate(5deg); }
    25% { transform: rotate(-18deg); }
    30% { transform: rotate(5deg); }
    35% { transform: rotate(-17deg); }
    40% { transform: rotate(5deg); }
    45% { transform: rotate(-18deg); }
    50% { transform: rotate(6deg); }
    58% { transform: rotate(-74deg); }
    62% { transform: rotate(-70deg); }
  }

  @keyframes wz_right_hand {
    0% { transform: rotate(-40deg); }
    10% { transform: rotate(-20deg); }
    15% { transform: rotate(-5deg); }
    20% { transform: rotate(-60deg); }
    25% { transform: rotate(-0deg); }
    30% { transform: rotate(-60deg); }
    35% { transform: rotate(-0deg); }
    40% { transform: rotate(-40deg); }
    45% { transform: rotate(-60deg); }
    50% { transform: rotate(10deg); }
    60% { transform: rotate(-40deg); }
  }

  @keyframes wz_right_finger {
    0% { transform: translateY(16px); }
    10% { transform: none; }
    50% { transform: none; }
    60% { transform: translateY(16px); }
  }

  @keyframes wz_left_finger {
    0% { transform: scaleX(0); }
    10% { transform: scaleX(1) rotate(6deg); }
    15% { transform: scaleX(1) rotate(0deg); }
    20% { transform: scaleX(1) rotate(8deg); }
    25% { transform: scaleX(1) rotate(0deg); }
    30% { transform: scaleX(1) rotate(7deg); }
    35% { transform: scaleX(1) rotate(0deg); }
    40% { transform: scaleX(1) rotate(5deg); }
    45% { transform: scaleX(1) rotate(0deg); }
    50% { transform: scaleX(1) rotate(6deg); }
    58% { transform: scaleX(0); }
  }

  @keyframes wz_head {
    0% { transform: rotate(-3deg); }
    10% { transform: translateX(10px) rotate(7deg); }
    50% { transform: translateX(0px) rotate(0deg); }
    56% { transform: rotate(-3deg); }
  }

  /* 三 Logo 轨迹动画 */
  @keyframes wz_path_linux {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    10% { transform: translateY(-165px) translateX(-35px) rotate(-12deg); }
    30% { transform: translateY(-180px) translateX(-45px) rotate(-5deg); }
    50% { transform: translateY(-165px) translateX(-35px) rotate(10deg); }
    58% { transform: translateY(-160px) translateX(-35px) rotate(0deg); }
    65% { transform: translateY(0) rotate(0deg); opacity: 1; }
    66% { opacity: 0.8; }
    100% { opacity: 0; transform: translateY(20px) scale(0.8); }
  }

  @keyframes wz_path_python {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    10% { transform: translateY(-135px) translateX(0px) rotate(15deg); }
    30% { transform: translateY(-120px) translateX(10px) rotate(-10deg); }
    50% { transform: translateY(-140px) translateX(-10px) rotate(12deg); }
    58% { transform: translateY(-130px) translateX(0px) rotate(0deg); }
    65% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { opacity: 0; transform: translateY(20px) scale(0.8); }
  }

  @keyframes wz_path_mac {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    10% { transform: translateY(-185px) translateX(35px) rotate(8deg); }
    30% { transform: translateY(-195px) translateX(45px) rotate(-12deg); }
    50% { transform: translateY(-180px) translateX(30px) rotate(6deg); }
    58% { transform: translateY(-180px) translateX(35px) rotate(0deg); }
    65% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { opacity: 0; transform: translateY(20px) scale(0.8); }
  }
</style>

<!-- 加载控制 JS 脚本 -->
<script>
  (function () {
    'use strict';
    var progressBar = document.querySelector('#loader .progress');
    
    // 创建内部填充条
    var progressFill = document.createElement('div');
    progressFill.className = 'progress-bar-fill';
    if (progressBar) {
      progressBar.appendChild(progressFill);
    }

    function setProgressBar(val) {
      if (progressFill) {
        progressFill.style.width = Math.min(val, 100) + '%';
      }
    }

    // 1. 强制在下一帧绘制 0% -> 25% 起始动画
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        setProgressBar(25);
      });
    });

    var currentProgress = 25;

    // 2. 模拟阶段性增长（最高到 85%）
    var progressInterval = setInterval(function () {
      if (currentProgress < 85) {
        currentProgress += Math.random() * 15 + 10;
        setProgressBar(currentProgress);
      }
    }, 150);

    var isDismissed = false;

    function dismissLoader() {
      if (isDismissed) return;
      isDismissed = true;

      clearInterval(progressInterval);
      
      // 3. 平滑滑向 100%
      if (progressFill) {
        progressFill.style.transition = 'width 0.3s ease-out';
      }
      setProgressBar(100);

      // 4. 给进度条 350ms 走完填充，然后整体淡出
      setTimeout(function () {
        var loader = document.getElementById('loader');
        if (loader) {
          loader.classList.add('is-hidden');
          setTimeout(function () {
            loader.style.display = 'none';
          }, 500);
        }
      }, 350); 
    }

    // 5. 加载事件绑定
    if (document.readyState === 'complete') {
      setTimeout(dismissLoader, 600);
    } else {
      window.addEventListener('load', function () {
        setTimeout(dismissLoader, 500);
      });
    }

    // 5 秒保底隐藏
    setTimeout(dismissLoader, 5000);
  })();
</script>
