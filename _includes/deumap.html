let map = null;
let markers = [];

// ===================== 初始化地图 =====================
function initMap() {
  map = L.map('uni-map').setView([50.87, 9.94], 6);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 18
  }).addTo(map);

  renderMarkers(UNIVERSITIES);
  renderList(UNIVERSITIES);
}

// ===================== 渲染标记 =====================
function renderMarkers(data) {
  // 清除旧标记
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  data.forEach(uni => {
    const popupContent = `
      <div style="font-family: 'Segoe UI', sans-serif; min-width: 180px;">
        <div style="font-size: 16px; font-weight: 600; color: #1a1a2e; margin-bottom: 6px;">${uni.name}</div>
        <div style="font-size: 13px; color: #666; line-height: 1.6;">
          <div>🏆 排名：<strong style="color: #1565c0;">#${uni.rank}</strong></div>
          <div>📍 城市：${uni.city}</div>
          <div>🌐 坐标：[${uni.lat.toFixed(4)}, ${uni.lng.toFixed(4)}]</div>
        </div>
      </div>
    `;

    const marker = L.marker([uni.lat, uni.lng])
      .addTo(map)
      .bindPopup(popupContent);

    marker.uniData = uni;
    markers.push(marker);
  });

  // 更新计数
  document.getElementById('uni-count').textContent = '共 ' + data.length + ' 所';
}

// ===================== 渲染列表 =====================
function renderList(data) {
  const listEl = document.getElementById('uni-list');

  if (data.length === 0) {
    listEl.innerHTML = '<div style="padding: 40px; text-align: center; color: #999;">未找到匹配的大学</div>';
    return;
  }

  let html = '';
  data.forEach(uni => {
    html += `
      <div class="uni-list-item" data-rank="${uni.rank}" 
           style="padding: 12px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 12px;"
           onmouseenter="this.style.background='#f5f5f5'" 
           onmouseleave="this.style.background='white'"
           onclick="focusUniversity(${uni.rank})">
        <div style="width: 36px; height: 36px; border-radius: 50%; background: #e3f2fd; color: #1565c0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0;">
          ${uni.rank}
        </div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-size: 14px; font-weight: 500; color: #1a1a2e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${uni.name}</div>
          <div style="font-size: 12px; color: #888; margin-top: 2px;">📍 ${uni.city}</div>
        </div>
        <div style="font-size: 12px; color: #bbb; flex-shrink: 0;">[${uni.lat.toFixed(2)}, ${uni.lng.toFixed(2)}]</div>
      </div>
    `;
  });

  listEl.innerHTML = html;
}

// ===================== 搜索 =====================
document.getElementById('uni-search').addEventListener('input', function(e) {
  const keyword = e.target.value.toLowerCase().trim();

  if (!keyword) {
    renderMarkers(UNIVERSITIES);
    renderList(UNIVERSITIES);
    return;
  }

  const filtered = UNIVERSITIES.filter(uni => 
    uni.name.toLowerCase().includes(keyword) ||
    uni.city.toLowerCase().includes(keyword) ||
    uni.rank.toString().includes(keyword)
  );

  renderMarkers(filtered);
  renderList(filtered);

  // 如果结果少，自动调整视图
  if (filtered.length > 0 && filtered.length < 10) {
    const group = new L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.2));
  }
});

// ===================== 聚焦到某所大学 =====================
function focusUniversity(rank) {
  const uni = UNIVERSITIES.find(u => u.rank === rank);
  if (!uni) return;

  // 关闭列表（移动端友好）
  const listEl = document.getElementById('uni-list');
  if (window.innerWidth < 768) {
    listEl.style.display = 'none';
  }

  map.setView([uni.lat, uni.lng], 12);

  // 找到对应的 marker 并打开 popup
  const marker = markers.find(m => m.uniData && m.uniData.rank === rank);
  if (marker) {
    marker.openPopup();
  }
}

// ===================== 重置视图 =====================
function resetMap() {
  map.setView([50.87, 9.94], 6);
  document.getElementById('uni-search').value = '';
  renderMarkers(UNIVERSITIES);
  renderList(UNIVERSITIES);
}

// ===================== 切换列表 =====================
function toggleList() {
  const listEl = document.getElementById('uni-list');
  listEl.style.display = listEl.style.display === 'none' ? 'block' : 'none';
}

// ===================== 初始化 =====================
document.addEventListener('DOMContentLoaded', initMap);
